<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卒業メッセージ</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }
        /* ▼ 下にくっつけた盛り付けパーツ用のデザイン ▼ */
        .status-box {
            margin-top: 25px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            border-left: 4px solid #4a90e2;
        }
        .status-box p {
            margin: 6px 0;
            font-size: 0.95rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 幼少期の写真 -->
        <img src="childhood.jpg" alt="幼少期の写真">
        
        <!-- メインメッセージ -->
        <p>初期状態（t = 0）の自分です。</p>
        <p>これからそれぞれのベクトルでしばらく**発散**するけれど、またいつか同じ座標に**収束**しような！</p>

        <!-- ▼ ここから下が新しく追加した「盛り付け」パーツ ▼ -->
        <hr style="margin: 25px 0; border: none; border-top: 1px solid #eaeaea;">
        <div class="status-box">
            <p>🎓 <strong>ID:</strong> 3年3組 30番</p>
            <p>📈 <strong>State:</strong> Diverging to future...</p>
            <p>💡 <strong>Message:</strong> よい青春を！またどこかで。</p>
        </div>
        <!-- ▲ ここまで ▲ -->
    </div>
</body>
</html>
